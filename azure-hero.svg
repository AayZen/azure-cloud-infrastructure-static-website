<svg width="900" height="760" viewBox="0 0 900 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Azure infrastructure dashboard illustration</title>
  <desc id="desc">A glassmorphism cloud architecture dashboard with connected Azure service nodes.</desc>
  <style>
    .float { animation: float 5.6s ease-in-out infinite; transform-origin: center; }
    .float-slow { animation: float 7s ease-in-out infinite reverse; transform-origin: center; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .dash { stroke-dasharray: 8 14; animation: dash 16s linear infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes pulse { 0%,100% { opacity: .62; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes dash { to { stroke-dashoffset: -220; } }
  </style>
  <defs>
    <linearGradient id="panel" x1="160" y1="132" x2="741" y2="632" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset="1" stop-color="#DFF8FF" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="blue" x1="214" y1="166" x2="711" y2="644" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset=".48" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005A9C"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="226" y1="206" x2="655" y2="566" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF" stop-opacity=".52"/>
      <stop offset="1" stop-color="#0078D4" stop-opacity=".12"/>
    </linearGradient>
    <filter id="shadow" x="96" y="82" width="708" height="610" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="34" stdDeviation="36" flood-color="#005A9C" flood-opacity=".23"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#005A9C" flood-opacity=".18"/>
    </filter>
  </defs>

  <circle cx="450" cy="380" r="334" fill="url(#softBlue)" opacity=".68"/>
  <circle class="pulse" cx="712" cy="185" r="20" fill="#50E6FF" opacity=".68"/>
  <circle class="pulse" cx="186" cy="590" r="18" fill="#0078D4" opacity=".5"/>
  <circle cx="710" cy="624" r="74" fill="#0078D4" opacity=".08"/>
  <circle cx="164" cy="174" r="94" fill="#50E6FF" opacity=".12"/>

  <g filter="url(#shadow)">
    <rect x="160" y="126" width="580" height="488" rx="42" fill="url(#panel)" stroke="#93DFFF" stroke-opacity=".72" stroke-width="2"/>
    <rect x="188" y="162" width="524" height="66" rx="22" fill="#F8FAFC" fill-opacity=".82" stroke="#B9EFFF"/>
    <circle cx="226" cy="195" r="11" fill="#50E6FF"/>
    <circle cx="258" cy="195" r="11" fill="#0078D4"/>
    <circle cx="290" cy="195" r="11" fill="#005A9C"/>
    <rect x="555" y="185" width="110" height="18" rx="9" fill="#0078D4" opacity=".24"/>

    <g class="float">
      <path d="M423 314c11-50 82-60 111-20 37-8 76 19 78 58 3 44-32 77-76 77H354c-43 0-77-34-75-76 2-43 41-74 84-64 13-20 34-33 60-25z" fill="url(#blue)"/>
      <path d="M385 332c6-32 51-40 71-14 23-5 49 11 51 36 2 28-21 49-49 49H343c-28 0-50-22-49-49 2-28 27-47 55-40 8-13 22-21 36-18z" fill="#fff" fill-opacity=".22"/>
    </g>

    <path class="dash" d="M452 430V512" stroke="#0078D4" stroke-width="4" stroke-linecap="round"/>
    <path class="dash" d="M452 300V252" stroke="#0078D4" stroke-width="4" stroke-linecap="round"/>
    <path class="dash" d="M366 392L272 478" stroke="#0078D4" stroke-width="4" stroke-linecap="round"/>
    <path class="dash" d="M540 390L636 478" stroke="#0078D4" stroke-width="4" stroke-linecap="round"/>

    <g filter="url(#smallShadow)">
      <rect x="344" y="506" width="216" height="78" rx="24" fill="#fff" fill-opacity=".9" stroke="#B9EFFF"/>
      <rect x="380" y="536" width="144" height="14" rx="7" fill="#0078D4" opacity=".22"/>
      <rect x="405" y="558" width="94" height="10" rx="5" fill="#50E6FF" opacity=".54"/>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="216" y="444" width="128" height="118" rx="26" fill="#fff" fill-opacity=".88" stroke="#B9EFFF"/>
      <circle cx="280" cy="488" r="24" fill="#0078D4" opacity=".18"/>
      <path d="M267 489h26m-13-13v26" stroke="#0078D4" stroke-width="7" stroke-linecap="round"/>
      <rect x="250" y="524" width="60" height="10" rx="5" fill="#0078D4" opacity=".2"/>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="560" y="444" width="128" height="118" rx="26" fill="#fff" fill-opacity=".88" stroke="#B9EFFF"/>
      <circle cx="624" cy="488" r="24" fill="#50E6FF" opacity=".2"/>
      <path d="M611 500v-26h26v26" stroke="#0078D4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="594" y="524" width="60" height="10" rx="5" fill="#0078D4" opacity=".2"/>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="346" y="232" width="212" height="58" rx="22" fill="#fff" fill-opacity=".9" stroke="#B9EFFF"/>
      <circle cx="382" cy="261" r="14" fill="#50E6FF" opacity=".56"/>
      <rect x="410" y="252" width="110" height="12" rx="6" fill="#0078D4" opacity=".2"/>
      <rect x="410" y="270" width="72" height="8" rx="4" fill="#005A9C" opacity=".16"/>
    </g>
  </g>

  <g class="float-slow" filter="url(#smallShadow)">
    <rect x="92" y="260" width="154" height="92" rx="24" fill="#fff" fill-opacity=".78" stroke="#B9EFFF"/>
    <circle cx="132" cy="306" r="21" fill="#0078D4" opacity=".16"/>
    <path d="M122 306h20m-10-10v20" stroke="#0078D4" stroke-width="6" stroke-linecap="round"/>
    <rect x="166" y="291" width="52" height="10" rx="5" fill="#0078D4" opacity=".28"/>
    <rect x="166" y="311" width="38" height="8" rx="4" fill="#50E6FF" opacity=".5"/>
  </g>

  <g class="float" filter="url(#smallShadow)">
    <rect x="660" y="294" width="152" height="94" rx="24" fill="#fff" fill-opacity=".78" stroke="#B9EFFF"/>
    <circle cx="702" cy="342" r="21" fill="#50E6FF" opacity=".22"/>
    <path d="M693 347c0-17 18-26 30-14 13 13 2 34-16 34-8 0-14-3-14-3" stroke="#0078D4" stroke-width="6" stroke-linecap="round"/>
    <rect x="738" y="327" width="44" height="10" rx="5" fill="#0078D4" opacity=".24"/>
    <rect x="738" y="347" width="30" height="8" rx="4" fill="#50E6FF" opacity=".48"/>
  </g>
</svg>
